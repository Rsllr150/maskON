# GitHub Actions workflow: run the test suite on every push and pull request.
name: CI

# When does this run? On any push, and on any pull request.
on:
  push:
  pull_request:

jobs:
  test:
    # The virtual machine GitHub spins up for us, fresh every time.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      # 1. Check out the repository code onto the machine.
      - uses: actions/checkout@v4

      # 2. Install Python — tested on each version of the matrix.
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 3. Install the package (editable) with its dev dependencies.
      - name: Install dependencies
        run: pip install -e ".[dev]"

      # 4. Lint: catch bugs and style issues.
      - name: Lint (ruff)
        run: ruff check maskon tests scripts

      # 5. Format: fail if the code isn't formatted.
      - name: Format check (ruff)
        run: ruff format --check maskon tests scripts

      # 6. Types: strict static type checking.
      - name: Type check (mypy)
        run: mypy maskon tests scripts

      # 7. Tests + coverage: the suite must stay green and coverage must stay
      #    above the threshold set in pyproject.toml ([tool.coverage.report]).
      - name: Run tests
        run: pytest --cov=maskon --cov-report=term-missing

  # The published artifact, as a user gets it: build the wheel, install it in
  # a fresh venv WITHOUT extras, then import it and type-check a consumer.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the wheel
        run: pip install build && python -m build --wheel --outdir dist

      - name: Install it in a fresh venv, no extras
        run: |
          python -m venv /tmp/consumer
          /tmp/consumer/bin/pip install dist/*.whl mypy
          if /tmp/consumer/bin/pip show fastapi; then exit 1; fi

      # Run from outside the checkout so `maskon` resolves to the wheel.
      - name: Strict consumer
        run: |
          cp scripts/check_consumer.py /tmp/consumer/
          cd /tmp/consumer
          bin/mypy --strict check_consumer.py
          bin/python check_consumer.py
